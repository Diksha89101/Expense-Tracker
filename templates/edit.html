<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit expense · Ledger</title>
    <script>try { if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (_error) {}</script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script defer src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body class="auth-page">
<button type="button" class="icon-button theme-toggle theme-corner" aria-label="Toggle theme">◐</button>
<main class="auth-shell">
    <a class="brand auth-brand" href="{{ url_for('home') }}"><span class="brand-mark">L</span><span>ledger<span class="brand-dot">.</span></span></a>
    <section class="auth-card">
        <p class="eyebrow">TRANSACTION</p><h1>Edit expense</h1><p>Update the transaction details below.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="auth-flash">{{ message }}</div>{% endfor %}{% endwith %}
        <form method="post" data-validate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group"><label class="form-label" for="title">Expense title</label><input class="form-control" id="title" name="title" maxlength="120" value="{{ expense.get('title', '') }}" required></div>
            <div class="form-group"><label class="form-label" for="amount">Amount</label><input class="form-control" id="amount" name="amount" type="number" min="0.01" step="0.01" value="{{ '%.2f'|format(expense.get('amount', 0)|float) }}" required></div>
            <div class="form-group"><label class="form-label" for="currency">Currency</label><select class="form-select" id="currency" name="currency" required>{% for currency in ['INR', 'USD', 'EUR', 'GBP', 'JPY', 'AUD', 'CAD', 'CHF', 'CNY'] %}<option value="{{ currency }}" {% if expense.get('currency', 'INR') == currency %}selected{% endif %}>{{ currency }}</option>{% endfor %}</select></div>
            <div class="form-group"><label class="form-label" for="category">Category</label><select class="form-select" id="category" name="category" required>{% for category in categories %}<option value="{{ category }}" {% if expense.get('category') == category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></div>
            <div class="form-group"><label class="form-label" for="date">Date</label><input class="form-control" id="date" name="date" type="date" value="{{ expense.get('date', '') }}" required></div>
            <div class="auth-actions"><button class="button button-primary" type="submit">Update expense</button><a class="button button-quiet" href="{{ url_for('home', **request.args.to_dict()) }}">Cancel</a></div>
        </form>
    </section>
</main>
</body>
</html>
